<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1c21" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid background covering 100% of grid space for PWA maskable standard compliance -->
  <rect width="512" height="512" fill="url(#bg-grad)" />

  <g transform="scale(0.85) translate(40, 40)" filter="url(#glow)">
    <!-- Main glowing cyber flame path -->
    <path d="M256,90 C290,165 370,185 370,270 C370,355 310,410 256,420 C202,410 142,355 142,270 C142,185 222,165 256,90 Z" 
          fill="none" 
          stroke="url(#cyber-grad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <circle cx="256" cy="256" r="32" fill="url(#cyber-grad)" opacity="0.9" />
    
    <!-- Pulse Ring around the core -->
    <path d="M220,256 A36,36 0 1,1 292,256" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />
    
    <!-- Upward Trend Accent Line -->
    <path d="M210,290 L245,255 L270,280 L305,235" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M290,235 L305,235 L305,250" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
