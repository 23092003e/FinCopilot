<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Background Dark Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#27272a" stroke-width="4" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-dasharray="12 18" stroke-opacity="0.25" />

  <!-- Inner Dynamic Shield/Phoenix Flame (Advanced AI Fin Design) -->
  <g filter="url(#glow)">
    <!-- Main glowing cyber flame path -->
    <path d="M256,90 C290,165 370,185 370,270 C370,355 310,410 256,420 C202,410 142,355 142,270 C142,185 222,165 256,90 Z" 
          fill="none" 
          stroke="url(#cyber-grad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Central Power Core (The AI Nucleus) -->
    <circle cx="256" cy="256" r="32" fill="url(#cyber-grad)" opacity="0.9" />
    
    <!-- Pulse Ring around the core -->
    <path d="M220,256 A36,36 0 1,1 292,256" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />
    
    <!-- Upward Trend Accent Line (Success & Growth) -->
    <path d="M210,290 L245,255 L270,280 L305,235" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M290,235 L305,235 L305,250" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
